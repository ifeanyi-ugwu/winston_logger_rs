[package]
name = "winston_http"
version = "0.4.0"
edition = "2021"
description = "winston-http for rust"
license = "MIT"
documentation = "https://docs.rs/winston_http"
repository = "https://github.com/ifeanyi-ugwu/winston_http_rs"
authors = ["ifeanyi ugwu"]
keywords = ["winston", "transport"]
categories = ["development-tools::debugging"]

[dependencies]
logform = { workspace = true, features = ["serde"] }
reqwest = { version = "0.12.15", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1.0.140"
tokio = { version = "1", features = ["rt"] }
whatwg_streams.workspace = true
winston_transport.workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time"] }
