[package]
name = "winston"
version = "0.8.3-dev"
edition = "2021"
description = "winston for rust"
license = "MIT"
documentation = "https://docs.rs/winston"
repository = "https://github.com/ifeanyi-ugwu/winston_rs"
authors = ["ifeanyi ugwu"]
keywords = ["winston", "logger", "logging"]
categories = ["development-tools::debugging"]

[dependencies]
arc-swap = "1.7"
chrono = "0.4.38"
crossbeam-channel = "0.5.13"
event-listener = { version = "5", optional = true }
futures.workspace = true
paste = { version = "1", optional = true }
log = { version = "0.4.28", optional = true }
logform.workspace = true
parking_lot = "0.12.3"
serde = { version = "1.0.208", features = ["derive"] }
serde_json = "1.0.125"
whatwg_streams.workspace = true
winston_file = { version = "0.3.2-dev", path = "../winston_file" }
winston_transport.workspace = true

[dev-dependencies]
criterion = "0.5.1"
serial_test = "3.2.0"
tokio = { workspace = true, features = ["macros"] }

[[bench]]
name = "logger_benchmark"
harness = false

[[bench]]
name = "queue_depth"
harness = false

[[example]]
name = "async_backpressure"
required-features = ["async-log"]

[profile.bench]
debug = true

[features]
# Opt-in async logging door: `Logger::log_async` / `info_async!` and the async
# mailbox `send` that yields the task (instead of parking the thread) under a
# saturated `OverflowPolicy::Block` slot. Pulls in `event-listener`; off by
# default so the standard build stays dependency-light (see ADR 0009).
async-log = ["dep:event-listener", "dep:paste"]
log-backend = ["log"]
#log-backend-kv = ["log-backend", "log/kv"]
log-backend-kv = ["log-backend", "log/kv_unstable"]
# Benchmark-only: lets `queue_depth` override the per-slot WritableStream
# high-water mark via the WINSTON_WS_HWM env var, to sweep WS depth
# independently of the mailbox capacity. No effect in normal builds.
internal-bench = []
