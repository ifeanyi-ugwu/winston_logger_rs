[workspace]
resolver = "3"
# Mid-migration: legacy `Transport<L>`/`AsyncTransport<L>` are being replaced
# with `Transport: WritableSink<LogInfo>`. Crates that haven't been migrated
# yet are temporarily excluded from the workspace; they re-join one per
# follow-up commit as they're ported.
members = [
    "logform",
    "logmark",
    "winston",
    "winston_daily_rotate_file",
    "winston_file",
    "winston_mongodb",
    "winston_transport",
]
exclude = [
    "winston_http",
    "winston_tracing",
]

[workspace.dependencies]
logform = { path = "logform", version = "0.8.0-dev" }
winston = { path = "winston", version = "0.8.3-dev" }
winston_transport = { path = "winston_transport", version = "0.7.2-dev" }
whatwg_streams = { path = "../../whatwg_streams/whatwg_streams_rs", features = ["send"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time"] }
futures = "0.3"
